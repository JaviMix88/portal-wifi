<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wi-Fi Gratis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh;
      background-color: #020c26;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 12px 24px;
      gap: 12px;
    }
    .afiche {
      width: 100%;
      max-width: 440px;
      height: auto;
      border-radius: 14px;
      display: block;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }
    .panel-boton {
      width: 100%;
      max-width: 440px;
      background: #061642;
      border: 1.5px solid #00d2ff;
      border-radius: 14px;
      padding: 12px 14px;
      text-align: center;
      color: #ffffff;
    }
    .boton {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: bold;
      color: #041338;
      background: linear-gradient(180deg, #ffe600 0%, #ffae00 100%);
      border: none;
      border-radius: 40px;
      cursor: pointer;
    }
    .aviso {
      margin-top: 8px;
      font-size: 0.78rem;
      line-height: 1.35;
      color: #dbeafe;
    }
  </style>
</head>

  <div class="panel-boton">
    <form id="portalForm" method="GET" action="">
      <button type="submit" class="boton">ACCEDER A INTERNET</button>
    </form>
    <p class="aviso">
      30 minutos gratis. Al terminar, vuelve a presionar el botón para conectarte.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ap = params.get('ga_srvr');
    const form = document.getElementById('portalForm');
    if (ap) {
      params.forEach((valor, clave) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = clave;
        input.value = valor;
        form.appendChild(input);
      });
      form.action = 'http://' + ap + ':880/cgi-bin/hotspot_login.cgi';
    } else {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Listo. Al conectarse al Wi-Fi de Cambium dará 30 minutos de internet.');
      });
    }
  </script>
